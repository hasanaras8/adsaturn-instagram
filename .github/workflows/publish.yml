name: Instagram yayıncı

on:
  schedule:
    - cron: "7 * * * *"      # her saat :07'de kuyruğu kontrol et (UTC)
    - cron: "17 6 * * 1"     # her pazartesi 09:17 (TR) anahtar sağlık kontrolü
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Deneme modu (hiçbir şey paylaşmaz)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      GRAPH_HOST: ${{ vars.GRAPH_HOST || 'graph.facebook.com' }}
      PAUSED: ${{ vars.PAUSED || '0' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Anahtar kontrolü (haftalık)
        if: github.event.schedule == '17 6 * * 1'
        run: node scripts/check-token.mjs

      - name: Zamanı gelen onaylı gönderileri yayınla
        if: github.event.schedule != '17 6 * * 1'
        run: node scripts/publish.mjs

      - name: Durumu repoya kaydet
        if: always() && env.DRY_RUN != '1'
        run: |
          git config user.name "adsaturn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A queue published
          git diff --cached --quiet || (git commit -m "Instagram: yayın durumu güncellendi" && git push)
