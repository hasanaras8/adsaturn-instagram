name: Instagram yayıncı

on:
  schedule:
    - cron: "7 * * * *"      # her saat :07'de kuyruğu kontrol et (UTC)
    - cron: "17 6 * * 1"     # her pazartesi 09:17 (TR) anahtar sağlık kontrolü
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Deneme modu (hiçbir şey paylaşmaz)"
        type: boolean
        default: true
      max_posts:
        description: "Bu çalıştırmada en fazla kaç gönderi (normalde 1)"
        type: string
        default: "1"
      threads_post:
        description: "(İsteğe bağlı) published/ altındaki gönderi(ler)i sonradan gönder — klasör adı veya all"
        type: string
        default: ""
      backfill_platform:
        description: "Sonradan gönderme hedefi"
        type: choice
        options: [threads, facebook]
        default: threads

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      GRAPH_HOST: ${{ vars.GRAPH_HOST || 'graph.facebook.com' }}
      PAUSED: ${{ vars.PAUSED || '0' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      FB_ENABLED: ${{ vars.FB_ENABLED || '1' }}
      MAX_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.max_posts || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Anahtar kontrolü (haftalık + elle çalıştırmada)
        if: github.event.schedule == '17 6 * * 1' || github.event_name == 'workflow_dispatch'
        run: node scripts/check-token.mjs

      - name: Threads anahtarını yenile (haftalık)
        if: github.event.schedule == '17 6 * * 1' && env.THREADS_ACCESS_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          node scripts/threads-refresh.mjs "$RUNNER_TEMP/th"
          if [ -n "$GH_TOKEN" ]; then gh secret set THREADS_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/th" && echo "🔐 Yeni Threads anahtarı kaydedildi"; else echo "::warning::GH_PAT tanımlı değil; yenilenen anahtar kaydedilemedi"; fi
          rm -f "$RUNNER_TEMP/th"

      - name: Eski gönderileri sonradan gönder (Threads / Facebook)
        if: github.event_name == 'workflow_dispatch' && inputs.threads_post != '' && env.DRY_RUN != '1'
        env:
          PLATFORM: ${{ inputs.backfill_platform }}
        run: node scripts/threads-post.mjs "${{ inputs.threads_post }}"

      - name: Zamanı gelen onaylı gönderileri yayınla
        if: github.event.schedule != '17 6 * * 1' && inputs.threads_post == ''
        run: node scripts/publish.mjs

      - name: Durumu repoya kaydet
        if: always() && env.DRY_RUN != '1'
        run: |
          git config user.name "adsaturn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A queue published
          git diff --cached --quiet || (git commit -m "Instagram: yayın durumu güncellendi" && (git push || (git pull --rebase origin main && git push)))
